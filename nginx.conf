map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Cloudflare Tunnel / upstream proxy is the only public ingress. The
    # Compose network is private; only trust the actual host-side proxy peer.
    # Replace with its exact address/CIDR if that peer changes.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 8m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
    }

    location / {
        set $cartethyia app;
        proxy_pass http://$cartethyia:12800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header True-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
}